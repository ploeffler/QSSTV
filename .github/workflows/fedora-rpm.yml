name: Fedora RPM experimental

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/fedora/**'
      - '.github/workflows/fedora-rpm.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/fedora/**'
      - '.github/workflows/fedora-rpm.yml'
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-22.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora build dependencies
        run: |
          dnf install -y gcc-c++ make git rpm-build rpmdevtools file \
            qt5-qtbase-devel qt5-qtmultimedia-devel qt5-qtsvg-devel \
            fftw-devel hamlib-devel alsa-lib-devel pulseaudio-libs-devel \
            openjpeg2-devel libv4l-devel qwt-qt5-devel
      - name: Build QSSTV on Fedora
        run: |
          mkdir -p build-fedora
          cd build-fedora
          qmake-qt5 ../src/qsstv.pro CONFIG+=release
          make -j2
          test -x qsstv
      - name: Package RPM
        run: |
          set -euo pipefail
          mkdir -p "$HOME/rpmbuild"/{SPECS,SOURCES,RPMS,BUILD,BUILDROOT,SRPMS}
          cp build-fedora/qsstv qsstv.desktop src/icons/qsstv.png "$HOME/rpmbuild/SOURCES/"
          cp packaging/fedora/qsstv.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild -bb "$HOME/rpmbuild/SPECS/qsstv.spec" --define "qsstv_version 9.5.8"
          mkdir -p out
          cp "$HOME"/rpmbuild/RPMS/x86_64/*.rpm out/
          rpm -qip out/*.rpm
          rpm -qlp out/*.rpm | grep -q /usr/bin/qsstv
      - uses: actions/upload-artifact@v4
        with:
          name: QSSTV-Fedora-RPM-experimental
          path: out/*.rpm
          if-no-files-found: error
