name: Windows experimental build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install PyYAML
      - name: Test packaging and release collection without Windows devices
        run: |
          python3 tests/test_windows_packaging.py
          python3 tests/test_unified_release.py
  windows:
    needs: packaging-tests
    runs-on: windows-latest
    permissions:
      contents: write # Required only for publishing the experimental release asset
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-7zip
            python
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-openjpeg2
            mingw-w64-x86_64-qwt-qt5
            make
            git
            autoconf
            automake
            libtool
            pkgconf
      - name: Build Hamlib for MinGW
        run: |
          git clone --depth 1 --branch 4.6.3 https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          # Hamlib 4.6.3 precise_time.c uses assert() without including assert.h.
          # Apply a build-local compatibility fix; do not modify QSSTV sources.
          sed -i '1i #include <assert.h>' lib/precise_time.c
          ./bootstrap
          ./configure --prefix=/mingw64 --disable-shared --enable-static --without-cxx-binding
          make -j2
          make install
          test -f /mingw64/include/hamlib/rig.h
      - name: Compile Windows executable
        run: |
          mkdir -p build-windows
          cd build-windows
          command -v qmake-qt5 || true
          ls -la /mingw64/bin/*qmake* || true
          /mingw64/bin/qmake-qt5.exe ../src/qsstv.pro CONFIG+=release
          mingw32-make -j2
          test -f release/qsstv.exe || test -f qsstv.exe
      - name: Build single portable Windows EXE
        run: bash scripts/package-windows.sh
      - name: Build device-free portable smoke fixture
        run: |
          mkdir portable-smoke
          cp dist-windows/portable-launcher.exe portable-smoke/
          g++ -std=c++11 -O2 -municode -static -static-libgcc -static-libstdc++ tests/windows-portable-smoke.cpp -o portable-smoke/qsstv.exe
          python scripts/package-windows-portable.py portable-smoke portable-smoke.exe
      - name: Test portable launcher without MSYS2 runtime or radio devices
        shell: pwsh
        run: ./tests/test_windows_portable.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QSSTV-Windows-experimental
          path: out-windows/*-portable.exe
          if-no-files-found: error
      - name: Publish experimental Windows prerelease
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-port-implementation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-experimental-${{ github.run_number }}
          name: QSSTV Windows Experimental #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Experimental Windows build from branch feature/windows-port-implementation.
            Single portable EXE: starts without installation, extracts its runtime temporarily and cleans it after exit.
            Audio/CAT/PTT on real hardware remain unverified.
            Commit: ${{ github.sha }}
          files: out-windows/*-portable.exe
          fail_on_unmatched_files: true
