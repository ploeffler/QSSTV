name: QSSTV UI screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ui-screenshots.yml'
      - 'scripts/capture-ui-screenshots.py'
      - 'src/**/*.ui'

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Designer UI renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 xvfb fonts-ubuntu
      - name: Render original Qt UI definitions
        run: |
          mkdir -p screenshots
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/capture-ui-screenshots.py screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: QSSTV-Qt-UI-screenshots
          path: screenshots/*.png
          if-no-files-found: error
